<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연세의원 홈페이지 관리</title>
<link rel="icon" type="image/png" href="/img/Logo.png">
<link rel="apple-touch-icon" href="/img/Logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --ink: #121212; --body: #4d4d4d; --mute: #707070; --line: rgba(18, 18, 18, 0.12); --bg: #f3f5f8; --brand: #1f3d73; --brand-dark: #162c55; --red: #c0392b; --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); font-size: 17px; line-height: 1.6; color: var(--body); background: var(--bg); word-break: keep-all; -webkit-font-smoothing: antialiased; padding-bottom: 120px; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .top img { width: 36px; height: 36px; border-radius: 8px; }
  .top b { font-size: 19px; color: var(--ink); }
  .top button { margin-left: auto; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 16px; cursor: pointer; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }

  .tabs { position: sticky; top: 64px; z-index: 9; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: -16px -16px 16px; padding: 10px 16px; background: var(--bg); }
  .tabs button { min-height: 52px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 17px; font-weight: 700; color: var(--ink); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }

  .card { margin-bottom: 16px; padding: 20px 16px; background: #fff; border-radius: 12px; border: 1px solid var(--line); }
  h1 { font-size: 22px; color: var(--ink); }
  h2 { font-size: 19px; color: var(--ink); margin-bottom: 12px; }
  .msg { padding: 40px 8px; text-align: center; font-size: 18px; }
  .help { margin-top: 6px; font-size: 16px; color: var(--mute); }
  .rule { margin-bottom: 16px; padding: 12px 14px; border-radius: 10px; background: #fdecea; color: #8a1f14; font-size: 16px; font-weight: 600; }

  label { display: block; margin-top: 16px; font-weight: 700; color: var(--ink); }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], textarea { display: block; width: 100%; min-height: 52px; margin-top: 6px; padding: 10px 12px; border: 1px solid #b9c0cc; border-radius: 10px; background: #fff; font-size: 17px; font-weight: 400; }
  textarea { min-height: 260px; line-height: 1.7; resize: vertical; }
  .check { display: flex; align-items: center; gap: 12px; min-height: 52px; margin-top: 16px; font-weight: 700; }
  .check input { width: 26px; height: 26px; accent-color: var(--brand); }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .pair span { margin-top: 6px; }
  .inline { display: flex; align-items: center; gap: 8px; }
  .inline input { width: 110px; }
  .inline span { margin-top: 6px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 20px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 17px; font-weight: 700; color: var(--ink); cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .btn.small { min-height: 48px; padding: 0 14px; font-size: 16px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .wide { width: 100%; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .row-btns .primary { flex: 1 1 100%; }

  .notice-item { display: block; width: 100%; margin-bottom: 10px; padding: 16px; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; }
  .notice-item b { display: block; font-size: 18px; color: var(--ink); }
  .notice-item small { font-size: 16px; color: var(--mute); }
  .pin { display: inline-block; margin-right: 6px; padding: 1px 8px; border-radius: 4px; background: #e3e8f1; color: var(--brand); font-size: 15px; font-weight: 700; vertical-align: 2px; }

  .group { border-left: 6px solid var(--brand); }
  .item { margin-top: 16px; padding: 14px; border-radius: 10px; background: var(--bg); }
  .item label { margin-top: 10px; font-size: 16px; }
  .item label:first-child { margin-top: 0; }
  .item .row-btns { margin-top: 12px; }
  .item .row-btns .btn { flex: 1; }

  .status { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--ink); color: #fff; font-size: 17px; font-weight: 600; text-align: center; }
  .status a { color: #fff; margin-left: 8px; }
  .status.ok { background: #1e7a46; }
  .status.err { background: var(--red); }
  .err-text { margin-top: 12px; color: var(--red); font-weight: 700; }

  dialog { width: min(480px, calc(100% - 32px)); margin: auto; padding: 24px 20px; border: 0; border-radius: 14px; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .warn { padding: 14px; border-radius: 10px; background: #fff4c2; border: 2px solid #e8c200; color: #4a3b00; }
  .warn b { display: block; font-size: 18px; }
  .warn p { margin-top: 8px; }
</style>
</head>
<body>
<header class="top"><img src="/img/Logo.png" alt=""><b>연세의원 홈페이지 관리</b><button type="button" id="logout" hidden>로그아웃</button></header>
<main id="app"><p class="msg">불러오는 중이에요…</p></main>
<div class="status" id="status" role="status" hidden></div>
<dialog id="warn-dlg"></dialog>

<script>
'use strict';
// 저장된 값은 전부 textContent / value 로만 화면에 넣음 (innerHTML 안 씀)
const app = document.getElementById('app');
const statusBar = document.getElementById('status');
const logoutBtn = document.getElementById('logout');

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k in el && !k.includes('-')) el[k] = v;
    else el.setAttribute(k, v);
  }
  el.append(...kids.flat(Infinity).filter(k => k != null && k !== false));   // 글자는 text node로 들어감
  return el;
}
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

async function api(path, body) {
  const res = await fetch('/api/' + path, body === undefined ? { cache: 'no-store' } : {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  return { status: res.status, ok: res.ok, data };
}

// ---- 상태 ----
let saved = null;     // 마지막으로 저장된 내용
let data = null;      // 고치는 중인 내용
let tab = 'notices';
let draft = null;     // 고치는 중인 공지 { id|null, title, date, pinned, body }
let busy = false;

const isDirty = () => !!saved && (JSON.stringify(data) !== JSON.stringify(saved) || (draft && JSON.stringify(draft) !== JSON.stringify(draftOrigin)));
let draftOrigin = null;
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
const leaveOk = () => !isDirty() || confirm('저장하지 않은 내용이 있어요.\n저장하지 않고 나갈까요?');
const discard = () => { data = clone(saved); draft = draftOrigin = null; };

// ---- 의료광고 규정 단어 ----
const BANNED = ['할인', '이벤트', '무료', '최저', '최고', '유일', '100%', '부작용 없', '완치', '보장', '위고비', '마운자로', '삭센다'];
const findBanned = texts => { const all = texts.join('\n'); return BANNED.filter(w => all.includes(w)); };

function askBanned(words) {
  const dlg = document.getElementById('warn-dlg');
  return new Promise(resolve => {
    const done = v => { dlg.close(); resolve(v); };
    dlg.replaceChildren(
      h('div', { class: 'warn' },
        h('b', {}, '의료광고 규정상 쓰면 안 되는 말일 수 있어요'),
        h('p', {}, '들어 있는 말: ', words.map(w => `“${w}”`).join(', ')),
        h('p', {}, '고칠 수 있으면 고쳐 주세요.')),
      h('div', { class: 'row-btns' },
        h('button', { type: 'button', class: 'btn primary', onclick: () => done(false) }, '고치러 가기'),
        h('button', { type: 'button', class: 'btn wide', onclick: () => done(true) }, '그래도 저장')));
    dlg.oncancel = e => { e.preventDefault(); done(false); };
    dlg.showModal();
  });
}

// ---- 저장 → 반영 확인 ----
let watchTimer = null;
function showStatus(text, kind, link) {
  statusBar.hidden = false;
  statusBar.className = 'status' + (kind ? ' ' + kind : '');
  statusBar.replaceChildren(text, link ? h('a', { href: '/', target: '_blank', rel: 'noopener' }, '홈페이지 보기') : '');
}

function watchDeploy(savedAt) {
  clearInterval(watchTimer);
  showStatus('홈페이지에 반영 중이에요 (1분쯤)');
  const started = Date.now();
  watchTimer = setInterval(async () => {
    try {
      const v = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
      if (v.savedAt && v.savedAt >= savedAt) { clearInterval(watchTimer); showStatus('반영됐어요', 'ok', true); return; }
    } catch {}
    if (Date.now() - started > 6 * 60 * 1000) { clearInterval(watchTimer); showStatus('반영이 늦어지고 있어요. 몇 분 뒤에 홈페이지를 확인해 주세요', 'err', true); }
  }, 5000);
}

async function save(next, texts) {
  if (busy) return false;
  const words = findBanned(texts);
  if (words.length && !(await askBanned(words))) return false;
  busy = true;
  showStatus('저장하는 중이에요…');
  try {
    const r = await api('content', { content: next, baseSavedAt: saved.savedAt });
    if (r.status === 401) { saved = null; showStatus('로그인이 풀렸어요. 다시 로그인해 주세요', 'err'); showLogin(); return false; }
    if (!r.ok) { showStatus(r.data.error || '저장하지 못했어요. 잠시 뒤 다시 해 주세요', 'err'); return false; }
    next.savedAt = r.data.savedAt;
    saved = clone(next);
    data = clone(next);
    if (r.data.deployed === false) showStatus('저장은 됐지만 홈페이지 반영 요청이 실패했어요. 잠시 뒤 한 번 더 저장해 주세요', 'err');
    else watchDeploy(r.data.savedAt);
    return true;
  } catch {
    showStatus('인터넷 연결을 확인하고 다시 저장해 주세요', 'err');
    return false;
  } finally {
    busy = false;
  }
}

// ---- 화면: 처음 / 로그인 ----
async function start() {
  let s;
  try { s = (await api('session')).data; } catch {}
  if (!s || !s.configured) { app.replaceChildren(h('p', { class: 'msg' }, '아직 설정 중이에요')); return; }
  if (!s.loggedIn) { showLogin(); return; }
  await loadContent();
}

function showLogin() {
  logoutBtn.hidden = true;
  const pw = h('input', { type: 'password', id: 'pw', autocomplete: 'current-password', required: true });
  const err = h('p', { class: 'err-text', role: 'alert' });
  const btn = h('button', { type: 'submit', class: 'btn primary wide' }, '들어가기');
  app.replaceChildren(h('form', { class: 'card', onsubmit: async e => {
    e.preventDefault();
    btn.disabled = true; err.textContent = '';
    try {
      const r = await api('login', { password: pw.value });
      if (r.ok) { await loadContent(); return; }
      err.textContent = r.data.error || '들어가지 못했어요';
    } catch { err.textContent = '인터넷 연결을 확인해 주세요'; }
    btn.disabled = false; pw.select();
  } },
    h('h1', {}, '로그인'),
    h('label', { htmlFor: 'pw' }, '비밀번호'), pw, err,
    h('div', { class: 'row-btns' }, btn)));
  pw.focus();
}

async function loadContent() {
  app.replaceChildren(h('p', { class: 'msg' }, '불러오는 중이에요…'));
  const r = await api('content').catch(() => null);
  if (!r || r.status === 401) { showLogin(); return; }
  if (!r.ok) { app.replaceChildren(h('p', { class: 'msg' }, '내용을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요')); return; }
  saved = r.data.content;
  data = clone(saved);
  logoutBtn.hidden = false;
  draw();
}

logoutBtn.onclick = async () => {
  if (!leaveOk()) return;
  await api('logout', {}).catch(() => {});
  saved = data = draft = draftOrigin = null;
  showLogin();
};

// ---- 화면: 탭 ----
const TABS = [['notices', '공지사항'], ['prices', '가격표'], ['hours', '진료 시간']];
function draw() {
  const y = scrollY;
  const tabs = h('nav', { class: 'tabs', role: 'tablist' }, TABS.map(([key, name]) =>
    h('button', { type: 'button', role: 'tab', 'aria-selected': String(tab === key), onclick: () => {
      if (tab === key) return;
      if (!leaveOk()) return;
      discard(); tab = key; draw(); scrollTo(0, 0);
    } }, name)));
  const body = tab === 'notices' ? (draft ? noticeEditor() : noticeList()) : tab === 'prices' ? pricesView() : hoursView();
  app.replaceChildren(tabs, body);
  scrollTo(0, y);
}

// ---- 공지사항 ----
const sorted = ns => [...ns].sort((a, b) => (b.pinned - a.pinned) || (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));

function openDraft(n) {
  draft = n ? clone(n) : { id: null, title: '', date: today(), pinned: false, body: '' };
  draftOrigin = clone(draft);
  draw(); scrollTo(0, 0);
}

function noticeList() {
  return h('div', {},
    h('button', { type: 'button', class: 'btn primary wide', onclick: () => openDraft(null) }, '새 공지 쓰기'),
    h('h2', { style: 'margin-top:24px' }, `올라간 공지 ${data.notices.length}개`),
    data.notices.length ? null : h('p', { class: 'help' }, '아직 공지가 없어요.'),
    sorted(data.notices).map(n => h('button', { type: 'button', class: 'notice-item', onclick: () => openDraft(n) },
      h('b', {}, n.pinned ? h('span', { class: 'pin' }, '맨 위') : null, n.title),
      h('small', {}, n.date, ' · 눌러서 고치기'))));
}

function noticeEditor() {
  const d = draft;
  const err = h('p', { class: 'err-text', role: 'alert' });
  const field = (id, label, input) => [h('label', { htmlFor: id }, label), input];
  const back = () => { if (!leaveOk()) return; draft = draftOrigin = null; draw(); scrollTo(0, 0); };

  const doSave = async () => {
    err.textContent = '';
    if (!d.title.trim()) { err.textContent = '제목을 써 주세요'; return; }
    if (!d.date) { err.textContent = '날짜를 골라 주세요'; return; }
    const next = clone(saved);
    if (d.id == null) next.notices.push({ ...d, id: next.nextNoticeId++ });
    else next.notices = next.notices.map(n => (n.id === d.id ? { ...d } : n));
    if (await save(next, [d.title, d.body])) { draft = draftOrigin = null; draw(); scrollTo(0, 0); }
  };
  const doDelete = async () => {
    if (!confirm(`“${d.title || '이 공지'}”를 지울까요?\n지우면 되돌릴 수 없어요.`)) return;
    const next = clone(saved);
    next.notices = next.notices.filter(n => n.id !== d.id);
    if (await save(next, [])) { draft = draftOrigin = null; draw(); scrollTo(0, 0); }
  };

  return h('div', { class: 'card' },
    h('h1', { style: 'margin-bottom:16px' }, d.id == null ? '새 공지 쓰기' : '공지 고치기'),
    h('p', { class: 'rule' }, '치료 후기·전후 사진·할인 이벤트는 올리면 안 돼요'),
    field('n-title', '제목', h('input', { type: 'text', id: 'n-title', value: d.title, maxLength: 200, oninput: e => { d.title = e.target.value; } })),
    field('n-date', '날짜', h('input', { type: 'date', id: 'n-date', value: d.date, oninput: e => { d.date = e.target.value; } })),
    h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: d.pinned, onchange: e => { d.pinned = e.target.checked; } }), '맨 위에 고정'),
    field('n-body', '내용', h('textarea', { id: 'n-body', value: d.body, oninput: e => { d.body = e.target.value; } })),
    h('p', { class: 'help' }, '빈 줄을 넣으면 문단이 나뉘어요. “1. ”처럼 숫자와 점으로 시작하는 줄을 이어 쓰면 번호 목록이 돼요.'),
    d.id === 8 ? h('p', { class: 'help' }, '이 공지는 진료과목 페이지의 “시술 후 주의사항 보기” 버튼과 이어져 있어요. 지우면 그 버튼도 사라져요.') : null,
    err,
    h('div', { class: 'row-btns' },
      h('button', { type: 'button', class: 'btn primary', onclick: doSave }, '저장'),
      h('button', { type: 'button', class: 'btn', onclick: back }, '목록으로'),
      d.id != null ? h('button', { type: 'button', class: 'btn danger', onclick: doDelete }, '지우기') : null));
}

// ---- 가격표 ----
function move(arr, i, by) { const j = i + by; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; draw(); }

function pricesView() {
  const p = data.prices;
  const err = h('p', { class: 'err-text', role: 'alert' });
  let uid = 0;
  const input = (label, obj, key, help) => {
    const id = 'p' + uid++;
    return [h('label', { htmlFor: id }, label), h('input', { type: 'text', id, value: obj[key], oninput: e => { obj[key] = e.target.value; } }), help ? h('p', { class: 'help' }, help) : null];
  };

  const groups = p.groups.map((g, gi) => h('section', { class: 'card group' },
    h('h2', {}, `묶음 ${gi + 1}`),
    input('묶음 이름', g, 'name'),
    input('묶음 작은 설명', g, 'note', '없으면 비워 두세요'),
    g.items.map((it, ii) => h('div', { class: 'item' },
      input('항목 이름', it, 'name'),
      input('작은 설명', it, 'note', '없으면 비워 두세요'),
      input('가격', it, 'price', '예: 100,000원'),
      h('div', { class: 'row-btns' },
        h('button', { type: 'button', class: 'btn small', disabled: ii === 0, onclick: () => move(g.items, ii, -1) }, '▲ 위로'),
        h('button', { type: 'button', class: 'btn small', disabled: ii === g.items.length - 1, onclick: () => move(g.items, ii, 1) }, '▼ 아래로'),
        h('button', { type: 'button', class: 'btn small danger', onclick: () => {
          if (confirm(`“${it.name || '이 줄'}” 줄을 지울까요?`)) { g.items.splice(ii, 1); draw(); }
        } }, '지우기')))),
    h('div', { class: 'row-btns' },
      h('button', { type: 'button', class: 'btn wide', onclick: () => { g.items.push({ name: '', note: '', price: '' }); draw(); } }, '+ 줄 추가'),
      h('button', { type: 'button', class: 'btn small', disabled: gi === 0, onclick: () => move(p.groups, gi, -1) }, '▲ 묶음 위로'),
      h('button', { type: 'button', class: 'btn small', disabled: gi === p.groups.length - 1, onclick: () => move(p.groups, gi, 1) }, '▼ 묶음 아래로'),
      h('button', { type: 'button', class: 'btn small danger', onclick: () => {
        if (confirm(`“${g.name || '이 묶음'}” 묶음을 통째로 지울까요?\n안에 있는 줄도 모두 지워져요.`)) { p.groups.splice(gi, 1); draw(); }
      } }, '묶음 지우기'))));

  const doSave = async () => {
    err.textContent = '';
    const empty = p.groups.find(g => !g.name.trim() || !g.items.length || g.items.some(it => !it.name.trim() || !it.price.trim()));
    if (empty) { err.textContent = '비어 있는 칸이 있어요. 묶음 이름, 항목 이름, 가격을 모두 써 주세요 (묶음에는 줄이 하나 이상 있어야 해요)'; return; }
    const texts = [...p.groups.flatMap(g => [g.name, g.note, ...g.items.flatMap(it => [it.name, it.note, it.price])]), ...p.notes];
    if (await save(clone(data), texts)) draw();
  };

  return h('div', {},
    groups,
    h('button', { type: 'button', class: 'btn wide', style: 'margin-bottom:16px', onclick: () => {
      p.groups.push({ name: '', note: '', items: [{ name: '', note: '', price: '' }] }); draw();
    } }, '+ 새 묶음 추가'),
    h('section', { class: 'card' },
      h('label', { htmlFor: 'p-notes' }, '표 아래 안내 문구'),
      h('textarea', { id: 'p-notes', style: 'min-height:200px', value: p.notes.join('\n'), oninput: e => {
        p.notes = e.target.value.split('\n').map(s => s.trim().replace(/^\*\s*/, '')).filter(Boolean);
      } }),
      h('p', { class: 'help' }, '한 줄에 하나씩 써 주세요. 앞에 *는 저절로 붙어요.')),
    err,
    h('button', { type: 'button', class: 'btn primary wide', onclick: doSave }, '가격표 저장'));
}

// ---- 진료 시간 ----
function hoursView() {
  const t = data.hours;
  const err = h('p', { class: 'err-text', role: 'alert' });
  const time = (key, label) => h('input', { type: 'time', value: t[key], 'aria-label': label, oninput: e => { t[key] = e.target.value; } });
  const range = (title, a, b) => h('section', { class: 'card' },
    h('h2', {}, title),
    h('div', { class: 'pair' }, time(a, title + ' 시작'), h('span', {}, '부터'), time(b, title + ' 끝')),
    h('p', { class: 'help' }, '왼쪽이 시작, 오른쪽이 끝나는 시간이에요'));
  const text = (id, label, key, help) => [h('label', { htmlFor: id }, label), h('input', { type: 'text', id, value: t[key], oninput: e => { t[key] = e.target.value; } }), h('p', { class: 'help' }, help)];

  const doSave = async () => {
    err.textContent = '';
    if (Object.entries(t).some(([k, v]) => k !== 'closedNote' && v === '')) { err.textContent = '비어 있는 칸이 있어요'; return; }
    const next = clone(data);
    next.hours.cutoffMinutes = Number(next.hours.cutoffMinutes);
    if (await save(next, [t.closedDays, t.closedNote])) draw();
  };

  return h('div', {},
    range('평일 진료', 'weekdayOpen', 'weekdayClose'),
    range('평일 점심시간', 'lunchStart', 'lunchEnd'),
    range('토요일 진료', 'satOpen', 'satClose'),
    h('section', { class: 'card' },
      h('h2', {}, '쉬는 날'),
      text('h-closed', '쉬는 날', 'closedDays', '예: 일요일·공휴일'),
      text('h-closed-note', '덧붙일 말', 'closedNote', '예: 임시공휴일 포함 (없으면 비워 두세요)')),
    h('section', { class: 'card' },
      h('h2', {}, '접수 마감'),
      h('div', { class: 'inline' }, h('span', {}, '진료 끝나기'),
        h('input', { type: 'number', inputMode: 'numeric', min: 1, max: 120, value: t.cutoffMinutes, 'aria-label': '접수 마감 몇 분 전', oninput: e => { t.cutoffMinutes = e.target.value === '' ? '' : Number(e.target.value); } }),
        h('span', {}, '분 전'))),
    range('피부 시술 예약 (평일)', 'skinWeekdayStart', 'skinWeekdayEnd'),
    range('피부 시술 예약 (토요일)', 'skinSatStart', 'skinSatEnd'),
    h('p', { class: 'help', style: 'margin-bottom:12px' }, '저장하면 첫 화면, 진료시간 표, 자주 묻는 질문, 오시는 길, 전화 창의 시간이 모두 함께 바뀌어요. 공지 글 안에 직접 쓴 시간은 공지에서 따로 고쳐 주세요.'),
    err,
    h('button', { type: 'button', class: 'btn primary wide', onclick: doSave }, '진료 시간 저장'));
}

start();
</script>
