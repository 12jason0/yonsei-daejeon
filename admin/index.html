<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연세의원 홈페이지 관리</title>
<link rel="icon" type="image/png" href="/img/Logo.png">
<link rel="apple-touch-icon" href="/img/Logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink: #121212; --body: #3d3d3d; --mute: #6b6b6b; --line: #e3e7ee; --bg: #eef1f5; --field: #f5f7fa;
    --brand: #1f3d73; --brand-dark: #162c55; --brand-tint: #e6ebf3; --red: #c0392b; --green: #1e7a46;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); font-size: 17px; line-height: 1.55; color: var(--body); background: var(--bg); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  /* 틀: PC는 왼쪽 메뉴 + 오른쪽 내용, 폰은 위쪽 탭 */
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 24px 16px; background: #fff; border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; font-size: 18px; font-weight: 700; color: var(--ink); }
  .brand img { width: 36px; height: 36px; border-radius: 8px; }
  .menu { display: flex; flex-direction: column; gap: 6px; }
  .menu button { height: 52px; padding: 0 20px; border: 0; border-radius: 999px; background: none; text-align: left; font-size: 17px; font-weight: 600; color: var(--body); cursor: pointer; }
  .menu button:hover { background: var(--field); }
  .menu button[aria-current="page"] { background: var(--brand); color: #fff; }
  .side .out { margin-top: auto; }
  .content { min-width: 0; padding: 32px 40px 48px; }
  .page { max-width: 960px; }

  @media (max-width: 899px) {
    .shell { display: block; }
    .side { position: sticky; z-index: 10; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px 12px; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { padding: 0; font-size: 17px; }
    .brand img { width: 32px; height: 32px; }
    .side .out { margin: 0 0 0 auto; }
    .menu { order: 3; flex: 1 1 100%; flex-direction: row; padding: 4px; border-radius: 999px; background: var(--field); }
    .menu button { flex: 1; height: 48px; padding: 0; text-align: center; font-size: 16px; }
    .content { padding: 20px 16px 32px; }
  }

  /* 제목 줄 */
  .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  h2 { font-size: 19px; font-weight: 700; color: var(--ink); }
  @media (max-width: 899px) { h1 { font-size: 24px; } }

  /* 카드 */
  .card { margin-bottom: 16px; padding: 24px; background: #fff; border-radius: 24px; }
  @media (max-width: 899px) { .card { padding: 18px 16px; border-radius: 20px; } }

  /* 버튼 */
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 24px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 17px; font-weight: 600; color: var(--ink); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { border-color: #c4cbd7; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.danger { color: var(--red); }
  .btn.small { height: 44px; padding: 0 16px; font-size: 16px; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }

  /* 입력칸 */
  label, .lbl { display: block; margin-bottom: 6px; font-size: 16px; font-weight: 600; color: var(--ink); }
  .field + .field { margin-top: 18px; }
  input[type=text], input[type=password], input[type=date], input[type=time], input[type=number], textarea { display: block; width: 100%; height: 52px; padding: 0 16px; border: 1px solid transparent; border-radius: 16px; background: var(--field); font-size: 17px; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand); background: #fff; }
  textarea { height: auto; min-height: 320px; padding: 14px 16px; line-height: 1.7; resize: vertical; }
  .check { display: inline-flex; align-items: center; gap: 10px; height: 52px; font-size: 17px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .check input { width: 24px; height: 24px; accent-color: var(--brand); }
  .row2 { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: end; }
  @media (max-width: 599px) { .row2 { grid-template-columns: 1fr; } }
  .rule { margin-bottom: 20px; padding: 12px 16px; border-radius: 14px; background: #fdecea; color: #8a1f14; font-size: 16px; font-weight: 600; }
  .err { margin-top: 12px; color: var(--red); font-size: 16px; font-weight: 600; }
  .err:empty { display: none; }

  /* 표 */
  table { width: 100%; border-collapse: collapse; font-size: 17px; }
  th { padding: 0 12px 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: 16px; font-weight: 600; color: var(--mute); }
  td { padding: 16px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .c-date { width: 140px; font-variant-numeric: tabular-nums; color: var(--mute); }
  .c-pin { width: 90px; }
  .notice-tbl tbody tr { cursor: pointer; }
  .notice-tbl tbody tr:hover td { background: var(--field); }
  .notice-tbl .t { padding: 0; border: 0; background: none; text-align: left; font-size: 17px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .tag { display: inline-block; padding: 2px 12px; border-radius: 999px; background: var(--brand-tint); color: var(--brand); font-size: 15px; font-weight: 700; }
  .empty { padding: 32px 0; text-align: center; color: var(--mute); }
  @media (max-width: 599px) {
    .notice-tbl thead { display: none; }
    .notice-tbl tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
    .notice-tbl tr:last-child { border-bottom: 0; }
    .notice-tbl td { padding: 0; border: 0; }
    .notice-tbl td:first-child { grid-column: 1 / -1; }
    .notice-tbl .c-date, .notice-tbl .c-pin { width: auto; }
  }

  /* 가격표 편집 */
  .group-head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .items th:nth-child(4) { width: 1%; }
  .items td { padding: 8px 6px; }
  .items th { padding: 0 6px 10px; }
  .items .c-price { width: 22%; }
  .items input { height: 48px; }
  .group-foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .group-foot .grow { margin-right: auto; }
  @media (max-width: 899px) {
    .group-head { grid-template-columns: 1fr; }
    .items thead { display: none; }
    .items tr { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .items td { padding: 0; border: 0; }
    .items .c-price { width: auto; }
    .items td[data-l]::before { content: attr(data-l); display: block; margin-bottom: 4px; font-size: 16px; font-weight: 600; color: var(--ink); }
    .group-foot .btn { flex: 1 1 auto; }
  }

  /* 진료 시간 */
  .time-row { display: grid; grid-template-columns: 200px 1fr auto 1fr; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .time-row:last-child { border-bottom: 0; }
  .time-row .lbl { margin: 0; }
  .time-row span { color: var(--mute); }
  .time-row input { min-width: 0; }
  .time-row .cut { grid-column: 2 / -1; }
  .cut { display: flex; align-items: center; gap: 10px; }
  .cut input { width: 100px; text-align: center; }
  @media (max-width: 599px) {
    .time-row { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
    .time-row input { padding: 0 10px; }
    .time-row .lbl, .time-row .cut { grid-column: 1 / -1; }
  }

  /* 늘 보이는 저장 줄 */
  .savebar { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 8px; padding: 16px 0 calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 24px); }
  .savebar .primary { min-width: 160px; }
  .savebar .left { margin-right: auto; }
  @media (max-width: 599px) { .savebar .primary { flex: 1 1 100%; order: -1; } .savebar .btn:not(.primary) { flex: 1; } .savebar .left { margin: 0; } }

  /* 위쪽 알림 */
  .toast { position: fixed; top: 16px; left: 50%; z-index: 30; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); padding: 14px 22px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 17px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }
  .toast.ok { background: var(--green); }
  .toast.err { background: var(--red); border-radius: 20px; }
  .toast a { color: #fff; white-space: nowrap; }

  /* 로그인 · 안내 */
  .center { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .login { width: min(420px, 100%); }
  .login .brand { justify-content: center; padding: 0 0 24px; font-size: 20px; }
  .login .brand img { width: 44px; height: 44px; }
  .login .btn { width: 100%; margin-top: 16px; }
  .msg { font-size: 18px; text-align: center; }

  dialog { width: min(460px, calc(100% - 32px)); margin: auto; padding: 24px; border: 0; border-radius: 24px; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog p { margin-top: 8px; }
  dialog .btns { margin-top: 20px; }
  dialog .btn { flex: 1; }
  .warn { padding: 16px; border-radius: 16px; background: #fff4c2; color: #4a3b00; }
  .warn b { font-size: 18px; }
</style>
</head>
<body>
<div id="root"><div class="center"><p class="msg">불러오는 중이에요…</p></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="warn-dlg"></dialog>

<script>
'use strict';
// 저장된 값은 전부 textContent / value 로만 화면에 넣음 (innerHTML 안 씀)
const root = document.getElementById('root');
const toast = document.getElementById('toast');

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k in el && !k.includes('-')) el[k] = v;
    else el.setAttribute(k, v);
  }
  el.append(...kids.flat(Infinity).filter(k => k != null && k !== false));   // 글자는 text node로 들어감
  return el;
}
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const btn = (text, onclick, cls = '', extra = {}) => h('button', { type: 'button', class: 'btn ' + cls, onclick, ...extra }, text);

async function api(path, body) {
  const res = await fetch('/api/' + path, body === undefined ? { cache: 'no-store' } : {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  return { status: res.status, ok: res.ok, data };
}

// ---- 상태 ----
let saved = null;     // 마지막으로 저장된 내용
let data = null;      // 고치는 중인 내용
let tab = 'notices';
let draft = null;     // 고치는 중인 공지 { id|null, title, date, pinned, body }
let draftOrigin = null;
let busy = false;

const isDirty = () => !!saved && (JSON.stringify(data) !== JSON.stringify(saved) || (draft && JSON.stringify(draft) !== JSON.stringify(draftOrigin)));
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
const leaveOk = () => !isDirty() || confirm('저장하지 않은 내용이 있어요.\n저장하지 않고 나갈까요?');
const discard = () => { data = clone(saved); draft = draftOrigin = null; };

// ---- 의료광고 규정 단어 ----
const BANNED = ['할인', '이벤트', '무료', '최저', '최고', '유일', '100%', '부작용 없', '완치', '보장', '위고비', '마운자로', '삭센다'];
const findBanned = texts => { const all = texts.join('\n'); return BANNED.filter(w => all.includes(w)); };

function askBanned(words) {
  const dlg = document.getElementById('warn-dlg');
  return new Promise(resolve => {
    const done = v => { dlg.close(); resolve(v); };
    dlg.replaceChildren(
      h('div', { class: 'warn' },
        h('b', {}, '의료광고 규정상 쓰면 안 되는 말일 수 있어요'),
        h('p', {}, words.map(w => `“${w}”`).join(', '))),
      h('div', { class: 'btns' },
        btn('고치기', () => done(false), 'primary'),
        btn('그래도 저장', () => done(true))));
    dlg.oncancel = e => { e.preventDefault(); done(false); };
    dlg.showModal();
  });
}

// ---- 저장 → 반영 확인 (알림은 화면 위쪽) ----
let watchTimer = null, toastTimer = null;
function showToast(text, kind, link) {
  clearTimeout(toastTimer);
  toast.hidden = false;
  toast.className = 'toast' + (kind ? ' ' + kind : '');
  toast.replaceChildren(text, link ? h('a', { href: '/', target: '_blank', rel: 'noopener' }, '홈페이지 보기') : '');
  if (kind === 'ok') toastTimer = setTimeout(() => { toast.hidden = true; }, 15000);
}

function watchDeploy(savedAt) {
  clearInterval(watchTimer);
  showToast('홈페이지에 반영 중이에요 (1분쯤)');
  const started = Date.now();
  watchTimer = setInterval(async () => {
    try {
      const v = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
      if (v.savedAt && v.savedAt >= savedAt) { clearInterval(watchTimer); showToast('반영됐어요', 'ok', true); return; }
    } catch {}
    if (Date.now() - started > 6 * 60 * 1000) { clearInterval(watchTimer); showToast('반영이 늦어지고 있어요. 몇 분 뒤에 홈페이지를 확인해 주세요', 'err', true); }
  }, 5000);
}

async function save(next, texts) {
  if (busy) return false;
  const words = findBanned(texts);
  if (words.length && !(await askBanned(words))) return false;
  busy = true;
  showToast('저장하는 중이에요…');
  try {
    const r = await api('content', { content: next, baseSavedAt: saved.savedAt });
    if (r.status === 401) { saved = null; showToast('로그인이 풀렸어요. 다시 로그인해 주세요', 'err'); showLogin(); return false; }
    if (!r.ok) { showToast(r.data.error || '저장하지 못했어요. 잠시 뒤 다시 해 주세요', 'err'); return false; }
    next.savedAt = r.data.savedAt;
    saved = clone(next);
    data = clone(next);
    if (r.data.deployed === false) showToast('저장은 됐지만 홈페이지 반영이 안 됐어요. 한 번 더 저장해 주세요', 'err');
    else watchDeploy(r.data.savedAt);
    return true;
  } catch {
    showToast('인터넷 연결을 확인하고 다시 저장해 주세요', 'err');
    return false;
  } finally {
    busy = false;
  }
}

// ---- 처음 / 로그인 ----
const brand = () => h('div', { class: 'brand' }, h('img', { src: '/img/Logo.png', alt: '' }), '연세의원');
const centerMsg = text => root.replaceChildren(h('div', { class: 'center' }, h('p', { class: 'msg' }, text)));

async function start() {
  let s;
  try { s = (await api('session')).data; } catch {}
  if (!s || !s.configured) { centerMsg('아직 설정 중이에요'); return; }
  if (!s.loggedIn) { showLogin(); return; }
  await loadContent();
}

function showLogin() {
  const pw = h('input', { type: 'password', id: 'pw', autocomplete: 'current-password', required: true });
  const err = h('p', { class: 'err', role: 'alert' });
  const go = h('button', { type: 'submit', class: 'btn primary' }, '들어가기');
  root.replaceChildren(h('div', { class: 'center' }, h('form', { class: 'card login', onsubmit: async e => {
    e.preventDefault();
    go.disabled = true; err.textContent = '';
    try {
      const r = await api('login', { password: pw.value });
      if (r.ok) { await loadContent(); return; }
      err.textContent = r.data.error || '들어가지 못했어요';
    } catch { err.textContent = '인터넷 연결을 확인해 주세요'; }
    go.disabled = false; pw.select();
  } }, brand(), h('label', { htmlFor: 'pw' }, '비밀번호'), pw, err, go)));
  pw.focus();
}

async function loadContent() {
  centerMsg('불러오는 중이에요…');
  const r = await api('content').catch(() => null);
  if (!r || r.status === 401) { showLogin(); return; }
  if (!r.ok) { centerMsg('내용을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요'); return; }
  saved = r.data.content;
  data = clone(saved);
  draw();
}

async function logout() {
  if (!leaveOk()) return;
  await api('logout', {}).catch(() => {});
  saved = data = draft = draftOrigin = null;
  showLogin();
}

// ---- 틀: 메뉴 3개 ----
const TABS = [['notices', '공지사항'], ['prices', '가격표'], ['hours', '진료 시간']];
function draw(keepScroll = true) {
  const y = scrollY;
  const menu = h('nav', { class: 'menu', 'aria-label': '메뉴' }, TABS.map(([key, name]) =>
    h('button', { type: 'button', 'aria-current': tab === key ? 'page' : null, onclick: () => {
      if (tab === key && !draft) return;
      if (!leaveOk()) return;
      discard(); tab = key; draw(false);
    } }, name)));
  const page = tab === 'notices' ? (draft ? noticeEditor() : noticeList()) : tab === 'prices' ? pricesView() : hoursView();
  root.replaceChildren(h('div', { class: 'shell' },
    h('aside', { class: 'side' }, brand(), menu, btn('로그아웃', logout, 'small out')),
    h('main', { class: 'content' }, h('div', { class: 'page' }, page))));
  scrollTo(0, keepScroll ? y : 0);
}

// ---- 공지사항 ----
const sorted = ns => [...ns].sort((a, b) => (b.pinned - a.pinned) || (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));

function openDraft(n) {
  draft = n ? clone(n) : { id: null, title: '', date: today(), pinned: false, body: '' };
  draftOrigin = clone(draft);
  draw(false);
}

function noticeList() {
  const rows = sorted(data.notices).map(n => h('tr', { onclick: () => openDraft(n) },
    h('td', {}, h('button', { type: 'button', class: 't' }, n.title)),
    h('td', { class: 'c-date' }, n.date),
    h('td', { class: 'c-pin' }, n.pinned ? h('span', { class: 'tag' }, '고정') : '')));
  return h('div', {},
    h('div', { class: 'head' }, h('h1', {}, '공지사항'), btn('새 공지 쓰기', () => openDraft(null), 'primary')),
    h('div', { class: 'card' }, rows.length
      ? h('table', { class: 'notice-tbl' },
          h('thead', {}, h('tr', {}, h('th', {}, '제목'), h('th', { class: 'c-date' }, '날짜'), h('th', { class: 'c-pin' }, '고정'))),
          h('tbody', {}, rows))
      : h('p', { class: 'empty' }, '공지가 없어요')));
}

function noticeEditor() {
  const d = draft;
  const err = h('p', { class: 'err', role: 'alert' });
  const done = () => { draft = draftOrigin = null; draw(false); };
  const back = () => { if (leaveOk()) done(); };

  const doSave = async () => {
    err.textContent = '';
    if (!d.title.trim()) { err.textContent = '제목을 써 주세요'; return; }
    if (!d.date) { err.textContent = '날짜를 골라 주세요'; return; }
    const next = clone(saved);
    if (d.id == null) next.notices.push({ ...d, id: next.nextNoticeId++ });
    else next.notices = next.notices.map(n => (n.id === d.id ? { ...d } : n));
    if (await save(next, [d.title, d.body])) done();
  };
  const doDelete = async () => {
    const extra = d.id === 8 ? '\n진료과목의 “시술 후 주의사항 보기” 버튼도 함께 없어져요.' : '';
    if (!confirm(`이 공지를 지울까요?\n지우면 되돌릴 수 없어요.${extra}`)) return;
    const next = clone(saved);
    next.notices = next.notices.filter(n => n.id !== d.id);
    if (await save(next, [])) done();
  };

  return h('div', {},
    h('div', { class: 'head' }, h('h1', {}, d.id == null ? '새 공지' : '공지 고치기'), btn('목록으로', back, 'small')),
    h('div', { class: 'card' },
      h('p', { class: 'rule' }, '치료 후기·전후 사진·할인 이벤트는 올리면 안 돼요'),
      h('div', { class: 'field' }, h('label', { htmlFor: 'n-title' }, '제목'),
        h('input', { type: 'text', id: 'n-title', value: d.title, maxLength: 200, oninput: e => { d.title = e.target.value; } })),
      h('div', { class: 'field row2' },
        h('div', {}, h('label', { htmlFor: 'n-date' }, '날짜'),
          h('input', { type: 'date', id: 'n-date', value: d.date, oninput: e => { d.date = e.target.value; } })),
        h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: d.pinned, onchange: e => { d.pinned = e.target.checked; } }), '맨 위에 고정')),
      h('div', { class: 'field' }, h('label', { htmlFor: 'n-body' }, '내용'),
        h('textarea', { id: 'n-body', value: d.body, oninput: e => { d.body = e.target.value; } })),
      err),
    h('div', { class: 'savebar' },
      d.id != null ? btn('지우기', doDelete, 'danger left') : null,
      btn('취소', back),
      btn('저장', doSave, 'primary')));
}

// ---- 가격표 ----
function move(arr, i, by) { const j = i + by; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; draw(); }

function pricesView() {
  const p = data.prices;
  const err = h('p', { class: 'err', role: 'alert' });
  let uid = 0;
  const input = (obj, key, label) => h('input', { type: 'text', value: obj[key], 'aria-label': label, oninput: e => { obj[key] = e.target.value; } });
  const labeled = (text, obj, key) => { const id = 'p' + uid++; return h('div', {}, h('label', { htmlFor: id }, text), h('input', { type: 'text', id, value: obj[key], oninput: e => { obj[key] = e.target.value; } })); };

  const groups = p.groups.map((g, gi) => h('section', { class: 'card' },
    h('div', { class: 'group-head' }, labeled('묶음 이름', g, 'name'), labeled('묶음 설명', g, 'note')),
    h('table', { class: 'items' },
      h('thead', {}, h('tr', {}, h('th', {}, '항목'), h('th', {}, '설명'), h('th', { class: 'c-price' }, '가격'), h('th', {}, ''))),
      h('tbody', {}, g.items.map((it, ii) => h('tr', {},
        h('td', { 'data-l': '항목' }, input(it, 'name', '항목')),
        h('td', { 'data-l': '설명' }, input(it, 'note', '설명')),
        h('td', { class: 'c-price', 'data-l': '가격' }, input(it, 'price', '가격')),
        h('td', {}, h('div', { class: 'btns', style: 'flex-wrap:nowrap' },
          btn('위로', () => move(g.items, ii, -1), 'small', { disabled: ii === 0 }),
          btn('아래로', () => move(g.items, ii, 1), 'small', { disabled: ii === g.items.length - 1 }),
          btn('지우기', () => { if (confirm(`“${it.name || '이 줄'}” 줄을 지울까요?`)) { g.items.splice(ii, 1); draw(); } }, 'small danger'))))))),
    h('div', { class: 'group-foot' },
      btn('줄 추가', () => { g.items.push({ name: '', note: '', price: '' }); draw(); }, 'small grow'),
      btn('묶음 위로', () => move(p.groups, gi, -1), 'small', { disabled: gi === 0 }),
      btn('묶음 아래로', () => move(p.groups, gi, 1), 'small', { disabled: gi === p.groups.length - 1 }),
      btn('묶음 지우기', () => {
        if (confirm(`“${g.name || '이 묶음'}” 묶음을 지울까요?\n안의 줄도 모두 지워져요.`)) { p.groups.splice(gi, 1); draw(); }
      }, 'small danger'))));

  const doSave = async () => {
    err.textContent = '';
    if (p.groups.some(g => !g.name.trim() || !g.items.length || g.items.some(it => !it.name.trim() || !it.price.trim()))) {
      err.textContent = '비어 있는 칸이 있어요. 묶음 이름, 항목, 가격을 모두 써 주세요';
      return;
    }
    const texts = [...p.groups.flatMap(g => [g.name, g.note, ...g.items.flatMap(it => [it.name, it.note, it.price])]), ...p.notes];
    if (await save(clone(data), texts)) draw();
  };

  return h('div', {},
    h('div', { class: 'head' }, h('h1', {}, '가격표'), btn('묶음 추가', () => {
      p.groups.push({ name: '', note: '', items: [{ name: '', note: '', price: '' }] }); draw();
      requestAnimationFrame(() => scrollTo(0, document.body.scrollHeight));
    }, 'small')),
    groups,
    h('section', { class: 'card' },
      h('label', { htmlFor: 'p-notes' }, '표 아래 안내'),
      h('textarea', { id: 'p-notes', style: 'min-height:200px', value: p.notes.join('\n'), oninput: e => {
        p.notes = e.target.value.split('\n').map(s => s.trim().replace(/^\*\s*/, '')).filter(Boolean);
      } })),
    err,
    h('div', { class: 'savebar' }, btn('저장', doSave, 'primary')));
}

// ---- 진료 시간 ----
function hoursView() {
  const t = data.hours;
  const err = h('p', { class: 'err', role: 'alert' });
  const time = (key, label) => h('input', { type: 'time', value: t[key], 'aria-label': label, oninput: e => { t[key] = e.target.value; } });
  const row = (label, a, b) => h('div', { class: 'time-row' }, h('span', { class: 'lbl' }, label), time(a, label + ' 시작'), h('span', {}, '~'), time(b, label + ' 끝'));
  const text = (id, label, key) => h('div', { class: 'field' }, h('label', { htmlFor: id }, label), h('input', { type: 'text', id, value: t[key], oninput: e => { t[key] = e.target.value; } }));

  const doSave = async () => {
    err.textContent = '';
    if (Object.entries(t).some(([k, v]) => k !== 'closedNote' && v === '')) { err.textContent = '비어 있는 칸이 있어요'; return; }
    const next = clone(data);
    next.hours.cutoffMinutes = Number(next.hours.cutoffMinutes);
    if (await save(next, [t.closedDays, t.closedNote])) draw();
  };

  return h('div', {},
    h('div', { class: 'head' }, h('h1', {}, '진료 시간')),
    h('section', { class: 'card' },
      h('h2', {}, '진료'),
      row('평일', 'weekdayOpen', 'weekdayClose'),
      row('평일 점심시간', 'lunchStart', 'lunchEnd'),
      row('토요일', 'satOpen', 'satClose'),
      h('div', { class: 'time-row' }, h('span', { class: 'lbl' }, '접수 마감'),
        h('div', { class: 'cut' }, h('span', {}, '진료 끝나기'),
          h('input', { type: 'number', inputMode: 'numeric', min: 1, max: 120, value: t.cutoffMinutes, 'aria-label': '접수 마감 몇 분 전', oninput: e => { t.cutoffMinutes = e.target.value === '' ? '' : Number(e.target.value); } }),
          h('span', {}, '분 전')))),
    h('section', { class: 'card' },
      h('h2', {}, '피부 시술 예약'),
      row('평일', 'skinWeekdayStart', 'skinWeekdayEnd'),
      row('토요일', 'skinSatStart', 'skinSatEnd')),
    h('section', { class: 'card' },
      h('h2', { style: 'margin-bottom:16px' }, '휴진'),
      text('h-closed', '쉬는 날', 'closedDays'),
      text('h-closed-note', '덧붙일 말', 'closedNote')),
    err,
    h('div', { class: 'savebar' }, btn('저장', doSave, 'primary')));
}

start();
</script>
</body>
</html>
